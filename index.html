<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#FF8C42">
<title>课后三表循环听写</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">课后三表循环听写</div>
    <button id="syncBtn" class="sync-btn" aria-label="云同步">同步</button>
  </header>
  <nav class="tabs">
    <button class="tab active" data-tab="tables"><svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg><span>三表内容</span></button>
    <button class="tab" data-tab="daily"><svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span>每日听写</span></button>
    <button class="tab" data-tab="stats"><svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg><span>听写统计</span></button>
    <button class="tab" data-tab="custom"><svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg><span>自定义</span></button>
  </nav>
  <main id="view"></main>
</div>

<button id="cartFab" class="cart-fab" aria-label="听写列表">
  <svg class="cart-ico" viewBox="0 0 64 64" width="40" height="40">
    <circle cx="32" cy="32" r="30" fill="url(#fabGrad)"/>
    <path d="M18 30 C18 18 46 18 46 30" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <rect x="12" y="28" width="15" height="20" rx="5" fill="#4A90E2"/>
    <rect x="37" y="28" width="15" height="20" rx="5" fill="#FFC56E"/>
    <circle cx="19.5" cy="36" r="3" fill="#fff"/>
    <circle cx="44.5" cy="36" r="3" fill="#fff"/>
    <defs>
      <linearGradient id="fabGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#FFA05C"/>
        <stop offset="100%" stop-color="#FF8C42"/>
      </linearGradient>
    </defs>
  </svg>
  <span id="cartCount" class="cart-badge">0</span>
</button>

<div id="overlay" class="overlay hidden"></div>
<div id="calOverlay" class="overlay hidden"></div>
<div id="sheet" class="sheet hidden"></div>
<div id="calSheet" class="sheet hidden"></div>
<div id="session" class="session hidden"></div>
<div id="toast" class="toast hidden"></div>

<div id="modalMask" class="modal-mask hidden">
  <div class="modal">
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
